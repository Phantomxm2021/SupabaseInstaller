# Optional managed-Nginx override. Use it only after installing and starting
# the native nginx-proxy-agent on the Docker host. The base Compose file stays
# in manual-proxy mode and deliberately has no access to /etc/nginx.
services:
  provisioner:
    environment:
      NGINX_PROXY_MODE: managed
      NGINX_PROXY_SOCKET: /run/supabase-manager/nginx-proxy-agent.sock
      NGINX_PROXY_TOKEN: ${NGINX_PROXY_TOKEN:?set NGINX_PROXY_TOKEN in deploy/.env}
    volumes:
      - /run/supabase-manager:/run/supabase-manager
